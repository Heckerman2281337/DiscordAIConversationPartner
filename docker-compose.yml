version: '3.8'

services:
  tts-server:
    build:
      context: ./localTts
      dockerfile: Dockerfile
    ports:
      - "8020:8020"
    volumes:
      - ./localTts/models:/app/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  discord-bot:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - ./system prompt.txt:/app/system prompt.txt
    depends_on:
      - tts-server
    environment:
      - TTS_API_URL=http://tts-server:8020/tts_to_audio/
      - LLM_API_ENDPOINT=http://host.docker.internal:11434/v1/chat/completions