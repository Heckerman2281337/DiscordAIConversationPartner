services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    volumes:
    - ollama_data:/root/.ollama
  tts-server:
    build:
      context: ./localTts
      dockerfile: Dockerfile
    container_name: tts-server
    restart: unless-stopped
    volumes:
      - ./localTts/models:/app/models
      - ./localTts/sample.wav:/app/sample.wav:ro   
    expose:
      - 8020

  discord-bot:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - ./system prompt.txt:/app/system prompt.txt
    depends_on:
      - tts-server
      - ollama
      
volumes:
  ollama_data: